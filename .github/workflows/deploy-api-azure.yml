name: Build and deploy Somnia API to Azure

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-somnia-api-${{ github.ref }}
  cancel-in-progress: false

env:
  API_PROJECT: ./server/src/Api/Somnia.Api.csproj
  PUBLISH_PATH: ./publish
  AZURE_WEBAPP_NAME: somnia-9f22f300

jobs:
  build:
    name: Build and publish API
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore "${{ env.API_PROJECT }}" --runtime win-x86
          if ($LASTEXITCODE -ne 0) { throw "Falha no restore da API." }

      - name: Build API
        shell: pwsh
        run: |
          dotnet build "${{ env.API_PROJECT }}" --configuration Release --runtime win-x86 --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Falha no build da API." }

      - name: Publish API
        shell: pwsh
        run: |
          dotnet publish "${{ env.API_PROJECT }}" `
            --configuration Release `
            --runtime win-x86 `
            --self-contained false `
            --no-build `
            --no-restore `
            /p:UseAppHost=false `
            --output "${{ env.PUBLISH_PATH }}"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a API." }
          if (-not (Test-Path "${{ env.PUBLISH_PATH }}/Somnia.Api.dll")) {
            throw "Somnia.Api.dll não encontrada na publicação."
          }

          Get-ChildItem "${{ env.PUBLISH_PATH }}" -Filter *.pdb -File -Recurse |
            Remove-Item -Force

          $publishSize = (Get-ChildItem "${{ env.PUBLISH_PATH }}" -File -Recurse |
            Measure-Object -Property Length -Sum).Sum
          "Publish size: $([math]::Round($publishSize / 1MB, 2)) MB"

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: somnia-api
          path: ./publish
          if-no-files-found: error

  migrate:
    name: Apply PostgreSQL migrations
    runs-on: windows-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./server/src/Api/Somnia.Api.csproj

      - name: Install Entity Framework CLI
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar dotnet-ef." }

      - name: Apply Neon migrations
        shell: pwsh
        env:
          ConnectionStrings__Postgres: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ConnectionStrings__Postgres)) {
            throw "Configure o secret NEON_CONNECTION_STRING com uma connection string Npgsql do Neon."
          }

          dotnet ef database update `
            --project ./server/src/Infraestrutura `
            --startup-project ./server/src/Api `
            --context SomniaDbContext `
            --configuration Release `
            --connection "$env:ConnectionStrings__Postgres"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao aplicar migrations no Neon." }

  deploy:
    name: Configure Azure and deploy API
    runs-on: windows-latest
    needs: [build, migrate]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: somnia-api
          path: ./publish

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FBE2A7630DFA41A281D552C49CD934B3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_293D7379EAC34AA6A4CB8788FDFB847F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3613012762CC4326B1793A52A8DA8B29 }}

      - name: Resolve Azure resource group
        shell: pwsh
        run: |
          $resourceGroup = az webapp list `
            --query "[?name=='$env:AZURE_WEBAPP_NAME'].resourceGroup | [0]" `
            --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resourceGroup)) {
            throw "Não foi possível localizar o App Service $env:AZURE_WEBAPP_NAME na assinatura Azure."
          }

          "AZURE_RESOURCE_GROUP=$($resourceGroup.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate production settings
        shell: pwsh
        env:
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
        run: |
          foreach ($name in @('JWT_SIGNING_KEY', 'SPOTIFY_CLIENT_ID', 'SPOTIFY_CLIENT_SECRET')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configure o secret/variable $name no GitHub."
            }
          }

          if ([System.Text.Encoding]::UTF8.GetByteCount($env:JWT_SIGNING_KEY) -lt 32) {
            throw "JWT_SIGNING_KEY deve possuir pelo menos 32 bytes."
          }

          if (-not [string]::IsNullOrWhiteSpace($env:CLIENT_ORIGIN)) {
            $origin = [Uri]::new($env:CLIENT_ORIGIN)
            if ($origin.Scheme -ne 'https' -or $origin.AbsolutePath -ne '/' -or $origin.Query -or $origin.Fragment) {
              throw "CLIENT_ORIGIN deve ser a origem HTTPS do frontend, sem caminho ou query."
            }
          }

      - name: Configure Azure Web App settings
        shell: pwsh
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
        run: |
          $settings = @(
            "ASPNETCORE_ENVIRONMENT=Production"
            "ConnectionStrings__Postgres=$env:NEON_CONNECTION_STRING"
            "Jwt__SigningKey=$env:JWT_SIGNING_KEY"
            "MusicCatalog__Provider=Spotify"
            "Spotify__ClientId=$env:SPOTIFY_CLIENT_ID"
            "Spotify__ClientSecret=$env:SPOTIFY_CLIENT_SECRET"
            "Spotify__Market=BR"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:CLIENT_ORIGIN)) {
            $settings += "Cors__AllowedOrigins__0=$env:CLIENT_ORIGIN"
          }

          az webapp config appsettings set `
            --resource-group "$env:AZURE_RESOURCE_GROUP" `
            --name "$env:AZURE_WEBAPP_NAME" `
            --settings $settings `
            --output none
          if ($LASTEXITCODE -ne 0) { throw "Falha ao configurar Azure App Settings." }

      - name: Verify required Azure settings
        shell: pwsh
        env:
          CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
        run: |
          $settings = az webapp config appsettings list `
            --resource-group "$env:AZURE_RESOURCE_GROUP" `
            --name "$env:AZURE_WEBAPP_NAME" `
            --query "[?name=='ConnectionStrings__Postgres' || name=='Jwt__SigningKey' || name=='Cors__AllowedOrigins__0'].name" `
            --output tsv
          if ($LASTEXITCODE -ne 0 -or $settings -notcontains 'ConnectionStrings__Postgres' -or
              $settings -notcontains 'Jwt__SigningKey') {
            throw "Não foi possível confirmar as configurações obrigatórias no Azure."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:CLIENT_ORIGIN) -and
              $settings -notcontains 'Cors__AllowedOrigins__0') {
            throw "CLIENT_ORIGIN foi informado, mas não apareceu nas configurações do Azure."
          }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./publish
